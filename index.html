<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frise Chronologique Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --teal: #3a7d76;
            --burgundy: #8c2b35;
            --rust: #b5451e;
            --gold: #c8922a;
            --slate: #4a5568;
            --olive: #5c6e2e;
            --plum: #6b3f5e;
            --midnight: #2c4a5e;
            
            --bg-cream: #fdfcfa;
            --bg-band: #f4f1ec;
            --text-main: #1a202c;
            --border-light: #e2e8f0;
            
            --font-title: 'Lora', serif;
            --font-ui: 'Source Sans 3', sans-serif;
            
            --axis-color: #4a5568;
            --axis-width: 2px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-cream);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Masthead --- */
        .masthead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background: #fff;
            border-bottom: 1px solid var(--border-light);
        }

        .masthead-logo {
            height: 80px;
            width: auto;
            max-width: 200px;
            object-fit: contain;
        }

        .masthead-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding: 0 20px;
        }

        .masthead-title {
            font-family: var(--font-title);
            font-size: 1.8rem;
            color: var(--midnight);
            outline: none;
            text-align: center;
            width: 100%;
            margin-bottom: 6px;
        }
        .masthead-title:focus {
            background-color: rgba(0,0,0,0.02);
        }

        .student-info {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .student-info input {
            border: 1px dashed transparent;
            border-bottom: 1px solid var(--border-light);
            background: transparent;
            font-size: 0.95rem;
            text-align: center;
            width: 130px;
            color: var(--slate);
            padding: 2px 5px;
            font-family: var(--font-ui);
            transition: all 0.2s;
        }
        .student-info input:hover { 
            border: 1px dashed var(--border-light); 
        }
        .student-info input:focus { 
            border: 1px dashed var(--teal); 
            outline: none; 
            background: rgba(0,0,0,0.02);
        }

        .masthead-counter {
            font-size: 0.9rem;
            color: var(--slate);
            font-weight: 600;
        }

        /* --- Toolbar --- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 10px 30px;
            background: #fff;
            border-bottom: 1px solid var(--border-light);
            align-items: center;
            font-size: 0.9rem;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 1px solid var(--border-light);
            padding-right: 15px;
        }
        .toolbar-group:last-child { border-right: none; }

        input, select, button {
            font-family: inherit;
            font-size: 0.9rem;
            padding: 4px 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: inherit;
        }

        input[type="number"] { width: 70px; }

        button {
            cursor: pointer;
            border: 1px solid var(--slate);
            background: transparent;
            color: var(--slate);
            font-weight: 600;
            transition: all 0.2s;
            border-radius: 0;
        }
        button:hover { background: rgba(0,0,0,0.05); }
        button.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
        button.primary:hover { background: #2f655f; }

        /* --- Timeline Area --- */
        .timeline-container {
            flex-grow: 1;
            position: relative;
            background: var(--bg-cream);
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .central-band {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 300px;
            transform: translateY(-50%);
            background: var(--bg-band);
            z-index: 0;
        }

        .scroll-area {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow-x: auto;
            overflow-y: hidden;
            cursor: grab;
            z-index: 1;
        }
        .scroll-area:active { cursor: grabbing; }

        .timeline-canvas {
            position: relative;
            height: 100%;
            min-width: 100%;
            transform-origin: left center;
        }

        .axis-svg {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 100px;
            transform: translateY(-50%);
            pointer-events: none;
            overflow: visible;
        }

        /* --- Empty State --- */
        .empty-state {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }
        .empty-state p { font-family: var(--font-title); font-style: italic; font-size: 1.5rem; color: var(--slate); margin-bottom: 10px;}
        .empty-state span { font-variant: small-caps; color: #718096; font-size: 0.9rem; }

        /* --- Elements --- */
        .period-band {
            position: absolute;
            top: 50%;
            height: 20px;
            transform: translateY(-50%);
            opacity: 0.3;
            pointer-events: none;
        }

        .event-point {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            z-index: 6;
            transition: transform 0.2s;
        }
        .event-point:hover { transform: translate(-50%, -50%) scale(1.3); }

        .connection-line {
            position: absolute;
            width: 2px;
            box-sizing: border-box;
            border-left: 2px dotted;
            transform: translateX(-50%);
            z-index: 3;
            pointer-events: none;
        }

        .event-card {
            position: absolute;
            background: #fff;
            border: 1px solid var(--border-light);
            border-top: 3px solid var(--teal);
            min-width: 160px;
            max-width: 350px;
            width: max-content;
            padding: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: grab;
            z-index: 4;
        }
        .event-card:active {
            cursor: grabbing;
        }
        
        .card-img-container {
            position: relative;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 6px;
        }
        
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 1px solid var(--border-light);
            pointer-events: none;
        }
        
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.3) 50%);
            cursor: nwse-resize;
            z-index: 10;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .resize-handle:hover {
            opacity: 1;
            background: linear-gradient(135deg, transparent 50%, var(--teal) 50%);
        }

        .card-date {
            font-size: 0.75rem;
            color: var(--slate);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .card-title {
            font-family: var(--font-title);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.2;
            color: var(--text-main);
        }
        .card-desc {
            font-size: 0.75rem;
            color: #4a5568;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- Tooltip --- */
        #tooltip {
            position: absolute;
            background: #fff;
            border: 1px solid var(--border-light);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            padding: 12px;
            width: 250px;
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            transition: opacity 0.2s;
            border-top: 3px solid var(--teal);
        }
        #tooltip img { max-width: 100%; height: auto; margin-bottom: 8px; }
        #tooltip h4 { font-family: var(--font-title); margin-bottom: 4px; }
        #tooltip .tt-date { font-size: 0.8rem; font-weight: bold; color: var(--slate); margin-bottom: 8px;}
        #tooltip p { font-size: 0.85rem; line-height: 1.4; white-space: pre-wrap;}

        /* --- Footer Legend --- */
        .footer {
            padding: 10px 30px;
            background: #fff;
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            align-items: center;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-swatch { width: 12px; height: 12px; border-radius: 2px; }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal {
            background: var(--bg-cream);
            width: 500px;
            max-width: 90vw;
            border-top: 4px solid var(--teal);
            box-shadow: 0 20px 25px rgba(0,0,0,0.1);
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal h2 { font-family: var(--font-title); margin-bottom: 15px; color: var(--midnight); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--slate); }
        .form-row { display: flex; gap: 10px; }
        .form-row > * { flex: 1; }
        
        .form-group input[type="text"], .form-group textarea, .form-group select {
            width: 100%; padding: 6px;
        }
        .form-group textarea { resize: vertical; height: 80px; }
        
        .swatches { display: flex; gap: 8px; margin-top: 4px; }
        .swatch { width: 24px; height: 24px; cursor: pointer; border: 2px solid transparent; }
        .swatch.selected { border-color: #000; box-shadow: 0 0 0 2px #fff inset; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-danger { color: var(--burgundy); border-color: var(--burgundy); margin-right: auto;}
        
        /* Image upload area */
        .img-upload {
            border: 2px dashed #cbd5e1;
            padding: 10px; text-align: center;
            cursor: pointer; font-size: 0.85rem; color: var(--slate);
        }
        .img-upload img { max-height: 80px; margin-top: 5px; }

        /* Axis Style Modal specific */
        .axis-swatches .swatch { width: 20px; height: 20px; }
    </style>
</head>

    <!-- Modal : Style Axe -->
    <div class="modal-overlay" id="modal-axis">
        <div class="modal" style="width: 400px;">
            <h2>Style de l'axe</h2>
            
            <div class="form-group">
                <label>Épaisseur (px) : <span id="axis-w-val">2</span></label>
                <input type="range" id="a-width" min="1" max="8" value="2" style="width:100%">
            </div>

            <div class="form-group">
                <label>Couleur</label>
                <div style="display:flex; gap:10px; align-items:center;">
                    <input type="color" id="a-color" value="#4a5568">
                    <div class="swatches axis-swatches" id="a-swatches"></div>

                <label>Type de trait</label>
                <select id="a-dash">
                    <option value="">Plein</option>
                    <option value="10,5">Tirets</option>
                    <option value="2,4">Pointillés</option>

            <div class="form-group">
                <label>Style de flèche</label>
                <select id="a-arrow">
                    <option value="solid">Triangle plein</option>
                    <option value="chevron">Chevron ouvert</option>
                    <option value="diamond">Losange</option>
                    <option value="circle">Cercle</option>
                    <option value="none">Aucune</option>

            </div>

            <div class="modal-actions">
                <button id="btn-reset-axis">Réinitialiser</button>
                <button id="btn-close-axis" class="primary">Fermer</button>
            </div>
        </div>
    </div>

<script>
    // --- Data & State ---
    const PALETTE = {
        teal: '#3a7d76', burgundy: '#8c2b35', rust: '#b5451e', gold: '#c8922a',
        slate: '#4a5568', olive: '#5c6e2e', plum: '#6b3f5e', midnight: '#2c4a5e'
    };
    const COLORS = Object.values(PALETTE);
    const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
    
    const MARGIN_X = 60; 

    let events = []; 
    let currentId = 1;
    let editingId = null;

    let view = {
        minYear: 1900, maxYear: 2000,
        zoomLevel: 1, 
        autoZoom: true,
        primaryScale: 'auto', secondaryScale: 'auto'
    };

    let axisStyle = {
        width: 2, color: PALETTE.slate, dash: '', arrow: 'solid'
    };

    // --- DOM Elements ---
    const elTimeline = document.getElementById('timeline-canvas');
    const elElementsLayer = document.getElementById('elements-layer');
    const elScroll = document.getElementById('scroll-area');
    const elEmpty = document.getElementById('empty-state');
    const elCentralBand = document.getElementById('central-band');
    
    // --- Init ---
    function init() {
        populateSwatches();
        bindEvents();
        updateUI();
    }

    // --- Core Logic ---
    function getFractionalYear(y, m, d) {
        if(!y) return 0;
        let frac = parseInt(y);
        if(m) frac += (parseInt(m) - 1) / 12;
        if(d) frac += (parseInt(d) - 1) / 365;
        return frac;
    }

    function formatDate(obj) {
        if(!obj || !obj.y) return "";
        let res = "";
        if(obj.d) res += obj.d + " ";
        if(obj.m) res += MONTHS[parseInt(obj.m)-1] + " ";
        res += obj.y;
        return res;
    }

    function applyFracToEvent(ev, newFrac, durationFrac) {
        let isYearOnly = !ev.start.m && !ev.start.d;

        if (isYearOnly) {
            ev.start.y = Math.round(newFrac);
        } else {
            ev.start.y = Math.floor(newFrac);
            let rem = newFrac - ev.start.y;
            if(rem < 0) rem += 1;
            ev.start.m = Math.floor(rem * 12) + 1;
            if (ev.start.d) {
                let remM = rem * 12 - (ev.start.m - 1);
                ev.start.d = Math.round(remM * 30.416) + 1;
                if(ev.start.d > 31) ev.start.d = 31;
                if(ev.start.d < 1) ev.start.d = 1;
            }
        }

        if (ev.type === 'period' && ev.end.y) {
            let endFrac = newFrac + durationFrac;
            let isEndYearOnly = !ev.end.m && !ev.end.d;
            if (isEndYearOnly) {
                ev.end.y = Math.round(endFrac);
            } else {
                ev.end.y = Math.floor(endFrac);
                let rem = endFrac - ev.end.y;
                if(rem < 0) rem += 1;
                ev.end.m = Math.floor(rem * 12) + 1;
                if (ev.end.d) {
                    let remM = rem * 12 - (ev.end.m - 1);
                    ev.end.d = Math.round(remM * 30.416) + 1;
                    if(ev.end.d > 31) ev.end.d = 31;
                    if(ev.end.d < 1) ev.end.d = 1;
                }
            }
        }
    }

    // --- Rendering ---
    function updateUI() {
        document.getElementById('event-count').textContent = events.length;
        
        if (events.length === 0) {
            elEmpty.style.display = 'block';
            elTimeline.style.opacity = '0';
            elCentralBand.style.opacity = '0';
            renderLegend();
            return;
        } else {
            elEmpty.style.display = 'none';
            elTimeline.style.opacity = '1';
            elCentralBand.style.opacity = '1';
        }

        if (view.autoZoom) {
            if(view.minYear >= view.maxYear) view.maxYear = view.minYear + 10;
            const containerWidth = elScroll.clientWidth;
            view.zoomLevel = containerWidth > 0 ? containerWidth : 1000;
        }

        const widthPx = view.zoomLevel;
        elTimeline.style.width = widthPx + 'px';
        
        drawAxisSVG();
        renderElements();
        renderLegend();
    }

    function drawAxisSVG() {
        const svg = document.getElementById('axis-svg');
        const line = document.getElementById('axis-line');
        const ticksGroup = document.getElementById('axis-ticks');
        
        document.documentElement.style.setProperty('--axis-color', axisStyle.color);
        line.setAttribute('stroke-width', axisStyle.width);
        line.setAttribute('stroke-dasharray', axisStyle.dash || 'none');
        
        if(axisStyle.arrow !== 'none') {
            line.setAttribute('marker-end', `url(#arrow-${axisStyle.arrow})`);
            const markers = document.querySelectorAll('marker path, marker circle');
            markers.forEach(m => {
                if(m.getAttribute('fill') && m.getAttribute('fill') !== 'none') m.setAttribute('fill', axisStyle.color);
                if(m.getAttribute('stroke')) m.setAttribute('stroke', axisStyle.color);
            });
        } else {
            line.removeAttribute('marker-end');
        }

        ticksGroup.innerHTML = '';
        
        let range = view.maxYear - view.minYear;
        if(range <= 0) return;

        let pStep = view.primaryScale === 'auto' ? getAutoStep(range, true) : parseInt(view.primaryScale);
        let sStep = view.secondaryScale === 'auto' ? getAutoStep(range, false) : parseInt(view.secondaryScale);

        const widthPx = elTimeline.offsetWidth;
        const innerWidth = widthPx - (MARGIN_X * 2);
        const pixelsPerYear = innerWidth > 0 && range > 0 ? innerWidth / range : 0;

        for(let y = Math.floor(view.minYear/sStep)*sStep; y <= view.maxYear; y+=sStep) {
            if(y < view.minYear || y > view.maxYear) continue;
            let x = MARGIN_X + (y - view.minYear) * pixelsPerYear;
            let lineEl = document.createElementNS("http://www.w3.org/2000/svg", "line");
            lineEl.setAttribute('x1', x); lineEl.setAttribute('y1', '40%');
            lineEl.setAttribute('x2', x); lineEl.setAttribute('y2', '60%');
            lineEl.setAttribute('stroke', axisStyle.color);
            lineEl.setAttribute('stroke-width', '1');
            lineEl.setAttribute('opacity', '0.4');
            ticksGroup.appendChild(lineEl);
        }

        for(let y = Math.floor(view.minYear/pStep)*pStep; y <= view.maxYear; y+=pStep) {
            if(y < view.minYear || y > view.maxYear) continue;
            let x = MARGIN_X + (y - view.minYear) * pixelsPerYear;
            
            let lineEl = document.createElementNS("http://www.w3.org/2000/svg", "line");
            lineEl.setAttribute('x1', x); lineEl.setAttribute('y1', '25%');
            lineEl.setAttribute('x2', x); lineEl.setAttribute('y2', '75%');
            lineEl.setAttribute('stroke', axisStyle.color);
            lineEl.setAttribute('stroke-width', Math.max(2, axisStyle.width-1));
            ticksGroup.appendChild(lineEl);

            let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute('x', x); text.setAttribute('y', '85%');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('fill', axisStyle.color);
            text.setAttribute('font-size', '12px');
            text.setAttribute('font-weight', '600');
            text.setAttribute('paint-order', 'stroke');
            text.setAttribute('stroke', 'var(--bg-cream)');
            text.setAttribute('stroke-width', '4');
            text.setAttribute('stroke-linecap', 'round');
            text.setAttribute('stroke-linejoin', 'round');
            text.textContent = y;
            ticksGroup.appendChild(text);
        }
    }

    function getAutoStep(range, isPrimary) {
        let steps = [1, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
        let target = range / (isPrimary ? 10 : 30);
        return steps.reduce((prev, curr) => Math.abs(curr - target) < Math.abs(prev - target) ? curr : prev);
    }

    function renderElements() {
        elElementsLayer.innerHTML = '';
        const widthPx = elTimeline.offsetWidth;
        const innerWidth = widthPx - (MARGIN_X * 2);
        const range = view.maxYear - view.minYear;
        const pxPerYear = innerWidth > 0 && range > 0 ? innerWidth / range : 0;

        events.sort((a,b) => getFractionalYear(a.start.y, a.start.m, a.start.d) - getFractionalYear(b.start.y, b.start.m, b.start.d));

        let altCounter = 0;

        events.forEach(ev => {
            let startFrac = getFractionalYear(ev.start.y, ev.start.m, ev.start.d);
            let xStart = MARGIN_X + (startFrac - view.minYear) * pxPerYear;
            
            if(ev.type === 'period' && ev.end.y) {
                let endFrac = Math.max(startFrac, getFractionalYear(ev.end.y, ev.end.m, ev.end.d));
                let w = (endFrac - startFrac) * pxPerYear;
                let band = document.createElement('div');
                band.className = 'period-band';
                band.dataset.id = ev.id;
                band.style.left = xStart + 'px';
                band.style.width = w + 'px';
                band.style.backgroundColor = ev.color;
                elElementsLayer.appendChild(band);
                
                createPoint(ev, xStart);
            } else {
                createPoint(ev, xStart);
            }

            let card = document.createElement('div');
            card.className = 'event-card';
            card.dataset.id = ev.id; 
            card.style.borderColor = 'var(--border-light)';
            card.style.borderTopColor = ev.color;
            
            let html = '';
            if(ev.image) {
                let w = ev.imgW || 52;
                let h = ev.imgH || 40;
                html += `<div class="card-img-container" style="width:${w}px; height:${h}px;">
                            <img src="${ev.image}" class="card-img" style="border-color:${ev.color}">
                            <div class="resize-handle" data-id="${ev.id}"></div>
                         </div>`;
            }
            
            let dateStr = formatDate(ev.start);
            if(ev.type === 'period' && ev.end.y) dateStr += " - " + formatDate(ev.end);
            
            html += `<div class="card-date">${dateStr}</div>`;
            html += `<div class="card-title">${escapeHTML(ev.title)}</div>`;
            if(ev.desc) html += `<div class="card-desc">${escapeHTML(ev.desc)}</div>`;
            card.innerHTML = html;

            let isTop = true;
            if(ev.pos === 'auto') {
                isTop = (altCounter % 2 === 0);
                altCounter++;
            } else if(ev.pos === 'bottom') {
                isTop = false;
            }

            let offset = ev.offsetY || 20;

            let line = document.createElement('div');
            line.className = 'connection-line';
            line.dataset.id = ev.id;
            line.style.left = xStart + 'px';
            line.style.borderLeftColor = ev.color;
            line.style.height = offset + 'px';

            if(isTop) {
                card.style.bottom = `calc(50% + ${offset}px)`;
                line.style.bottom = '50%';
                card.dataset.pos = 'top';
            } else {
                card.style.top = `calc(50% + ${offset}px)`;
                line.style.top = '50%';
                card.dataset.pos = 'bottom';
            }

            card.style.left = xStart + 'px';
            if(ev.align === 'center') card.style.transform = 'translateX(-50%)';
            else if(ev.align === 'left') card.style.transform = 'translateX(0)';
            else if(ev.align === 'right') card.style.transform = 'translateX(-100%)';

            card.addEventListener('dblclick', (e) => { e.stopPropagation(); openEventModal(ev.id); });
            setupTooltip(card, ev, dateStr);

            elElementsLayer.appendChild(line);
            elElementsLayer.appendChild(card);
        });
    }

    function createPoint(ev, x) {
        let pt = document.createElement('div');
        pt.className = 'event-point';
        pt.dataset.id = ev.id;
        pt.style.left = x + 'px';
        pt.style.backgroundColor = ev.color;
        pt.addEventListener('dblclick', (e) => { e.stopPropagation(); openEventModal(ev.id); });
        elElementsLayer.appendChild(pt);
    }

    function renderLegend() {
        const foot = document.getElementById('legend-footer');
        foot.innerHTML = '';
        let used = {};
        events.forEach(ev => {
            if(ev.catName && !used[ev.color]) used[ev.color] = ev.catName;
        });
        
        Object.keys(used).forEach(color => {
            let d = document.createElement('div');
            d.className = 'legend-item';
            d.innerHTML = `<div class="legend-swatch" style="background:${color}"></div><span>${escapeHTML(used[color])}</span>`;
            foot.appendChild(d);
        });
        if(Object.keys(used).length === 0) foot.style.display = 'none';
        else foot.style.display = 'flex';
    }

    let dragObj = { isDown: false, startX: 0, scrollLeft: 0, hasMoved: false };
    let resizeObj = { isResizing: false, el: null, evId: null, startX: 0, startY: 0, startW: 0, startH: 0, hasMoved: false };
    let cardDragObj = { isDragging: false, el: null, lineEl: null, pointEl: null, bandEl: null, dateEl: null, evId: null, startX: 0, startY: 0, startOffset: 0, currentOffset: 0, isTop: true, startFrac: 0, durationFrac: 0, pxPerYear: 0, hasMoved: false };
    
    function bindEvents() {
        elScroll.addEventListener('mousedown', e => {
            if(e.target.classList.contains('resize-handle')) {
                e.stopPropagation();
                resizeObj.isResizing = true;
                resizeObj.hasMoved = false;
                resizeObj.el = e.target.parentElement;
                resizeObj.evId = parseInt(e.target.dataset.id);
                resizeObj.startX = e.pageX;
                resizeObj.startY = e.pageY;
                resizeObj.startW = resizeObj.el.offsetWidth;
                resizeObj.startH = resizeObj.el.offsetHeight;
                return;
            }

            const cardTarget = e.target.closest('.event-card');
            const pointTarget = e.target.closest('.event-point');
            const target = cardTarget || pointTarget;

            if(target && !e.target.classList.contains('resize-handle')) {
                e.stopPropagation(); 
                cardDragObj.isDragging = true;
                cardDragObj.hasMoved = false;
                cardDragObj.evId = parseInt(target.dataset.id);
                
                cardDragObj.el = document.querySelector(`.event-card[data-id="${cardDragObj.evId}"]`);
                cardDragObj.lineEl = document.querySelector(`.connection-line[data-id="${cardDragObj.evId}"]`);
                cardDragObj.pointEl = document.querySelector(`.event-point[data-id="${cardDragObj.evId}"]`);
                cardDragObj.bandEl = document.querySelector(`.period-band[data-id="${cardDragObj.evId}"]`);
                cardDragObj.dateEl = cardDragObj.el ? cardDragObj.el.querySelector('.card-date') : null;
                
                cardDragObj.startX = e.pageX;
                cardDragObj.startY = e.pageY;
                
                let ev = events.find(x => x.id === cardDragObj.evId);
                cardDragObj.startOffset = ev.offsetY || 20;
                cardDragObj.currentOffset = cardDragObj.startOffset;
                cardDragObj.isTop = cardDragObj.el ? cardDragObj.el.dataset.pos === 'top' : true;
                
                cardDragObj.startFrac = getFractionalYear(ev.start.y, ev.start.m, ev.start.d);
                if(ev.type === 'period' && ev.end.y) {
                    let endFrac = getFractionalYear(ev.end.y, ev.end.m, ev.end.d);
                    cardDragObj.durationFrac = endFrac - cardDragObj.startFrac;
                }
                
                const innerWidth = elTimeline.offsetWidth - (MARGIN_X * 2);
                const range = view.maxYear - view.minYear;
                cardDragObj.pxPerYear = innerWidth > 0 && range > 0 ? innerWidth / range : 0;
                return;
            }

            if(e.target.closest('.event-point')) return;
            dragObj.isDown = true;
            dragObj.hasMoved = false;
            dragObj.startX = e.pageX - elScroll.offsetLeft;
            dragObj.scrollLeft = elScroll.scrollLeft;
        });

        window.addEventListener('mousemove', e => {
            if(resizeObj.isResizing) {
                e.preventDefault();
                const deltaX = e.pageX - resizeObj.startX;
                const deltaY = e.pageY - resizeObj.startY;
                if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) resizeObj.hasMoved = true;
                
                if (resizeObj.hasMoved) {
                    let newW = Math.max(30, resizeObj.startW + deltaX);
                    let newH = Math.max(30, resizeObj.startH + deltaY);
                    resizeObj.el.style.width = newW + 'px';
                    resizeObj.el.style.height = newH + 'px';
                }
            
            } else if (cardDragObj.isDragging) {
                e.preventDefault();
                const deltaX = e.pageX - cardDragObj.startX;
                const deltaY = e.pageY - cardDragObj.startY;
                
                if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
                    cardDragObj.hasMoved = true;
                }

                if (cardDragObj.hasMoved) {
                    // Update Vertical Offset
                    let newOffset = cardDragObj.isTop ? cardDragObj.startOffset - deltaY : cardDragObj.startOffset + deltaY;
                    newOffset = Math.max(5, newOffset); 
                    cardDragObj.currentOffset = newOffset;
                    
                    if(cardDragObj.el) {
                        if(cardDragObj.isTop) {
                            cardDragObj.el.style.bottom = `calc(50% + ${newOffset}px)`;
                        } else {
                            cardDragObj.el.style.top = `calc(50% + ${newOffset}px)`;
                        }
                    }
                    if(cardDragObj.lineEl) cardDragObj.lineEl.style.height = `${newOffset}px`;

                    // Update Horizontal position (Date)
                    if (cardDragObj.pxPerYear > 0) {
                        let addedYears = deltaX / cardDragObj.pxPerYear;
                        let newFrac = cardDragObj.startFrac + addedYears;
                        
                        let ev = events.find(x => x.id === cardDragObj.evId);
                        applyFracToEvent(ev, newFrac, cardDragObj.durationFrac);

                        let xStart = MARGIN_X + (newFrac - view.minYear) * cardDragObj.pxPerYear;
                        if(cardDragObj.el) cardDragObj.el.style.left = xStart + 'px';
                        if(cardDragObj.lineEl) cardDragObj.lineEl.style.left = xStart + 'px';
                        if(cardDragObj.pointEl) cardDragObj.pointEl.style.left = xStart + 'px';
                        
                        if (cardDragObj.bandEl && ev.type === 'period' && ev.end.y) {
                            cardDragObj.bandEl.style.left = xStart + 'px';
                        }

                        let dateStr = formatDate(ev.start);
                        if(ev.type === 'period' && ev.end.y) dateStr += " - " + formatDate(ev.end);
                        if(cardDragObj.dateEl) cardDragObj.dateEl.textContent = dateStr;
                    }
                }

            } else if(dragObj.isDown) {
                e.preventDefault();
                const x = e.pageX - elScroll.offsetLeft;
                const walk = (x - dragObj.startX) * 1.5;
                if (Math.abs(walk) > 3) dragObj.hasMoved = true;
                elScroll.scrollLeft = dragObj.scrollLeft - walk;
            }
        });

        window.addEventListener('mouseup', () => {
            if(resizeObj.isResizing) {
                resizeObj.isResizing = false;
                if(resizeObj.hasMoved) {
                    let ev = events.find(x => x.id === resizeObj.evId);
                    if(ev) {
                        ev.imgW = resizeObj.el.offsetWidth;
                        ev.imgH = resizeObj.el.offsetHeight;
                        updateUI(); 
                    }
                }
            }
            if(cardDragObj.isDragging) {
                cardDragObj.isDragging = false;
                if(cardDragObj.hasMoved) {
                    let ev = events.find(x => x.id === cardDragObj.evId);
                    if(ev) {
                        ev.offsetY = cardDragObj.currentOffset;
                        
                        // Recalcul des bornes auto-zoom si l'événement a été glissé au bord
                        let startFrac = getFractionalYear(ev.start.y, 1, 1);
                        if(startFrac < view.minYear) view.minYear = Math.floor(startFrac) - 5;
                        if(startFrac > view.maxYear) view.maxYear = Math.ceil(startFrac) + 5;
                        if(ev.type === 'period' && ev.end.y) {
                            let endFrac = getFractionalYear(ev.end.y, 12, 31);
                            if(endFrac > view.maxYear) view.maxYear = Math.ceil(endFrac) + 5;
                        }
                        document.getElementById('tb-min-year').value = view.minYear;
                        document.getElementById('tb-max-year').value = view.maxYear;

                        updateUI();
                    }
                }
            }
            dragObj.isDown = false;
        });

        elScroll.addEventListener('dblclick', e => {
            if(e.target.closest('.event-card') || e.target.closest('.event-point')) return;
            
            const rect = elTimeline.getBoundingClientRect();
            const x = e.clientX - rect.left - MARGIN_X;
            const innerWidth = rect.width - (MARGIN_X * 2);
            let year = 0;
            if(innerWidth > 0 && events.length > 0) {
                year = Math.round(view.minYear + (x / innerWidth) * (view.maxYear - view.minYear));
            } else {
                year = Math.round((view.minYear + view.maxYear) / 2);
            }
            openEventModal(null, year);
        });

        document.getElementById('btn-apply-range').addEventListener('click', () => {
            let min = parseInt(document.getElementById('tb-min-year').value);
            let max = parseInt(document.getElementById('tb-max-year').value);
            if(!isNaN(min) && !isNaN(max)) {
                view.minYear = min; view.maxYear = max;
                view.autoZoom = true;
                updateUI();
            }
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            view.autoZoom = false;
            view.zoomLevel = Math.max(elScroll.clientWidth, view.zoomLevel * 1.2);
            updateUI();
        });
        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            view.autoZoom = false;
            view.zoomLevel = Math.max(elScroll.clientWidth, view.zoomLevel * 0.8);
            updateUI();
        });
        document.getElementById('btn-zoom-auto').addEventListener('click', () => {
            view.autoZoom = true; updateUI();
        });

        document.getElementById('scale-primary').addEventListener('change', e => { view.primaryScale = e.target.value; updateUI(); });
        document.getElementById('scale-secondary').addEventListener('change', e => { view.secondaryScale = e.target.value; updateUI(); });
        window.addEventListener('resize', () => { if(view.autoZoom) updateUI(); });

        document.getElementById('btn-add-event').addEventListener('click', () => openEventModal());
        document.getElementById('btn-cancel-event').addEventListener('click', closeModals);
        document.getElementById('btn-save-event').addEventListener('click', saveEvent);
        document.getElementById('btn-delete-event').addEventListener('click', deleteEvent);
        document.getElementById('f-type').addEventListener('change', e => {
            document.getElementById('group-end-date').style.display = (e.target.value === 'period') ? 'flex' : 'none';
        });

        document.getElementById('btn-axis-style').addEventListener('click', openAxisModal);
        document.getElementById('btn-close-axis').addEventListener('click', closeModals);
        document.getElementById('btn-reset-axis').addEventListener('click', () => {
            axisStyle = { width: 2, color: PALETTE.slate, dash: '', arrow: 'solid' };
            syncAxisModal(); updateUI();
        });

        ['a-width', 'a-color', 'a-dash', 'a-arrow'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateAxisFromModal);
        });

        const imgInput = document.getElementById('f-file-input');
        const imgBox = document.getElementById('f-img-upload');
        const btnRemImg = document.getElementById('btn-remove-img');
        
        imgBox.addEventListener('click', () => imgInput.click());
        imgBox.addEventListener('dragover', e => { e.preventDefault(); imgBox.style.borderColor = 'var(--teal)'; });
        imgBox.addEventListener('dragleave', e => { imgBox.style.borderColor = '#cbd5e1'; });
        imgBox.addEventListener('drop', e => {
            e.preventDefault(); imgBox.style.borderColor = '#cbd5e1';
            if(e.dataTransfer.files && e.dataTransfer.files[0]) handleImage(e.dataTransfer.files[0]);
        });
        imgInput.addEventListener('change', e => {
            if(e.target.files && e.target.files[0]) handleImage(e.target.files[0]);
        });
        btnRemImg.addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('f-img-preview').innerHTML = '';
            imgInput.value = '';
            btnRemImg.style.display = 'none';
            imgBox.dataset.base64 = '';
        });

        document.getElementById('btn-export').addEventListener('click', exportToPNG);
        document.getElementById('btn-export-pdf').addEventListener('click', exportToPDF);
    }

    function setupTooltip(el, ev, dateStr) {
        const tt = document.getElementById('tooltip');
        el.addEventListener('mouseenter', e => {
            let html = '';
            if(ev.image) html += `<img src="${ev.image}">`;
            html += `<div class="tt-date">${dateStr}</div>`;
            html += `<h4>${escapeHTML(ev.title)}</h4>`;
            if(ev.desc) html += `<p>${escapeHTML(ev.desc)}</p>`;
            tt.innerHTML = html;
            tt.style.opacity = 1;
            positionTooltip(e);
        });
        el.addEventListener('mousemove', positionTooltip);
        el.addEventListener('mouseleave', () => tt.style.opacity = 0);
    }
    
    function positionTooltip(e) {
        const tt = document.getElementById('tooltip');
        let x = e.pageX + 15;
        let y = e.pageY + 15;
        if(x + 250 > window.innerWidth) x = e.pageX - 265;
        if(y + tt.offsetHeight > window.innerHeight) y = e.pageY - tt.offsetHeight - 15;
        tt.style.left = x + 'px';
        tt.style.top = y + 'px';
    }

        document.getElementById('f-desc').value = '';

            document.getElementById(`f-${p}-d`).value = '';
            document.getElementById(`f-${p}-m`).value = '';
            document.getElementById(`f-${p}-y`).value = '';
        });
        document.getElementById('f-cat-name').value = '';
        document.getElementById('f-pos').value = 'auto';
        document.getElementById('f-align').value = 'center';
        document.getElementById('f-img-preview').innerHTML = '';
        document.getElementById('f-img-upload').dataset.base64 = '';
        document.getElementById('btn-remove-img').style.display = 'none';

            document.getElementById('f-start-d').value = ev.start.d || '';
            document.getElementById('f-start-m').value = ev.start.m || '';
            document.getElementById('f-start-y').value = ev.start.y || '';
            
            if(ev.end) {
                document.getElementById('f-end-d').value = ev.end.d || '';
                document.getElementById('f-end-m').value = ev.end.m || '';
                document.getElementById('f-end-y').value = ev.end.y || '';
            }
            
            document.getElementById('f-cat-name').value = ev.catName || '';
            document.getElementById('f-pos').value = ev.pos || 'auto';
            document.getElementById('f-align').value = ev.align || 'center';
            
            let swatch = Array.from(document.querySelectorAll('#f-swatches .swatch')).find(s => s.dataset.color === ev.color);
            if(swatch) selectSwatch(swatch, 'f-swatches');

            if(ev.image) {
                document.getElementById('f-img-preview').innerHTML = `<img src="${ev.image}">`;
                document.getElementById('f-img-upload').dataset.base64 = ev.image;
                document.getElementById('btn-remove-img').style.display = 'inline-block';

        } else if(presetYear) {
            document.getElementById('f-start-y').value = presetYear;
        }

        document.getElementById('f-type').dispatchEvent(new Event('change'));
        document.getElementById('modal-event').classList.add('active');
    }

    function saveEvent() {
        const title = document.getElementById('f-title').value.trim();
        const yStart = document.getElementById('f-start-y').value;
        if(!title || !yStart) { alert("Le titre et l'année de début sont obligatoires."); return; }

        const type = document.getElementById('f-type').value;
        let existingEvent = editingId ? events.find(e => e.id === editingId) : null;
        
        const ev = {
            id: editingId || currentId++,
            type: type,
            title: title,
            desc: document.getElementById('f-desc').value,
            start: {
                d: document.getElementById('f-start-d').value,
                m: document.getElementById('f-start-m').value,
                y: yStart
            },
            end: type === 'period' ? {
                d: document.getElementById('f-end-d').value,
                m: document.getElementById('f-end-m').value,
                y: document.getElementById('f-end-y').value
            } : {},
            color: document.querySelector('#f-swatches .swatch.selected').dataset.color,
            catName: document.getElementById('f-cat-name').value.trim(),
            pos: document.getElementById('f-pos').value,
            align: document.getElementById('f-align').value,
            image: document.getElementById('f-img-upload').dataset.base64 || null,
            imgW: existingEvent ? existingEvent.imgW : 52,
            imgH: existingEvent ? existingEvent.imgH : 40,
            offsetY: existingEvent ? existingEvent.offsetY : 20
        };

        if(editingId) {
            events = events.map(e => e.id === editingId ? ev : e);
        } else {
            events.push(ev);
        }

        let startFrac = getFractionalYear(ev.start.y, 1, 1);
        if(startFrac < view.minYear) view.minYear = Math.floor(startFrac) - 5;
        if(startFrac > view.maxYear) view.maxYear = Math.ceil(startFrac) + 5;
        
        if(type === 'period' && ev.end.y) {
            let endFrac = getFractionalYear(ev.end.y, 12, 31);
            if(endFrac > view.maxYear) view.maxYear = Math.ceil(endFrac) + 5;
        }
        
        document.getElementById('tb-min-year').value = view.minYear;
        document.getElementById('tb-max-year').value = view.maxYear;

        view.autoZoom = true;
        closeModals();
        updateUI();
    }

    function deleteEvent() {
        if(confirm("Supprimer cet élément ?")) {
            events = events.filter(e => e.id !== editingId);
            closeModals();
            view.autoZoom = true;
            updateUI();
        }
    }

    async function generateExportCanvas() {
        if(events.length === 0) {
            alert("La frise est vide.");
            return null;
        }
        
        const scale = 2; 
        const width = elTimeline.offsetWidth;
        const height = elTimeline.offsetHeight;
        const headerHeight = 100; 
        
        const canvas = document.createElement('canvas');
        canvas.width = width * scale;
        canvas.height = (height + headerHeight) * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        ctx.fillStyle = '#fdfcfa';
        ctx.fillRect(0, 0, width, height + headerHeight);
        
        const logoElement = document.querySelector('.masthead-logo');
        if (logoElement && logoElement.src) {
            await new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    const targetH = 60;
                    const targetW = img.width * (targetH / img.height);
                    ctx.drawImage(img, 30, (headerHeight - targetH) / 2, targetW, targetH);
                    resolve();
                };
                img.onerror = resolve; 
                img.src = logoElement.src;
            });
        }

        const titleElement = document.querySelector('.masthead-title');
        const titleText = titleElement ? titleElement.innerText.trim() : "Frise Chronologique";
        
        const nom = document.getElementById('info-nom').value.trim();
        const prenom = document.getElementById('info-prenom').value.trim();
        const classe = document.getElementById('info-classe').value.trim();
        
        let studentText = [];
        if(nom) studentText.push(`Nom : ${nom}`);
        if(prenom) studentText.push(`Prénom : ${prenom}`);
        if(classe) studentText.push(`Classe : ${classe}`);

        ctx.textAlign = 'center';
        
        if (studentText.length > 0) {
            ctx.fillStyle = '#2c4a5e'; 
            ctx.font = '600 28px "Lora", serif';
            ctx.fillText(titleText, width / 2, 35);
            
            ctx.fillStyle = '#4a5568';
            ctx.font = '400 14px "Source Sans 3", sans-serif';
            ctx.fillText(studentText.join('   |   '), width / 2, 70);
        } else {
            ctx.fillStyle = '#2c4a5e'; 
            ctx.font = '600 28px "Lora", serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(titleText, width / 2, headerHeight / 2);
        }

        ctx.translate(0, headerHeight);

        ctx.fillStyle = '#f4f1ec';
        const bandH = 300;
        ctx.fillRect(0, (height - bandH)/2, width, bandH);

        const imagesToLoad = events.filter(e => e.image).map(e => {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve({ id: e.id, img });
                img.onerror = () => resolve({ id: e.id, img: null });
                img.src = e.image;
            });
        });
        const loadedImages = await Promise.all(imagesToLoad);
        const imgMap = {};
        loadedImages.forEach(item => { if(item.img) imgMap[item.id] = item.img; });

        const range = view.maxYear - view.minYear;
        const innerWidth = width - (MARGIN_X * 2);
        const pxPerYear = innerWidth > 0 && range > 0 ? innerWidth / range : 0;
        
        events.forEach(ev => {
            if(ev.type === 'period' && ev.end.y) {
                let startFrac = getFractionalYear(ev.start.y, ev.start.m, ev.start.d);
                let endFrac = Math.max(startFrac, getFractionalYear(ev.end.y, ev.end.m, ev.end.d));
                let xStart = MARGIN_X + (startFrac - view.minYear) * pxPerYear;
                let w = (endFrac - startFrac) * pxPerYear;
                
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = ev.color;
                ctx.fillRect(xStart, height/2 - 10, w, 20);
                ctx.globalAlpha = 1.0;
            }
        });

        ctx.strokeStyle = axisStyle.color;
        ctx.lineWidth = axisStyle.width;
        if(axisStyle.dash) ctx.setLineDash(axisStyle.dash.split(',').map(Number));
        else ctx.setLineDash([]);
        
        ctx.beginPath();
        ctx.moveTo(0, height/2);
        ctx.lineTo(width, height/2);
        ctx.stroke();
        ctx.setLineDash([]);

        if(axisStyle.arrow !== 'none') {
            ctx.fillStyle = axisStyle.color;
            ctx.beginPath();
            if(axisStyle.arrow === 'solid') {
                ctx.moveTo(width, height/2); ctx.lineTo(width-10, height/2-5); ctx.lineTo(width-10, height/2+5);
            } else if(axisStyle.arrow === 'chevron') {
                ctx.moveTo(width-8, height/2-4); ctx.lineTo(width, height/2); ctx.lineTo(width-8, height/2+4);
                ctx.stroke(); ctx.beginPath();
            } else if(axisStyle.arrow === 'diamond') {
                ctx.moveTo(width, height/2); ctx.lineTo(width-5, height/2-5); ctx.lineTo(width-10, height/2); ctx.lineTo(width-5, height/2+5);
            } else if(axisStyle.arrow === 'circle') {
                ctx.arc(width-5, height/2, 4, 0, 2*Math.PI);
            }
            ctx.fill();
        }

        let pStep = view.primaryScale === 'auto' ? getAutoStep(range, true) : parseInt(view.primaryScale);
        let sStep = view.secondaryScale === 'auto' ? getAutoStep(range, false) : parseInt(view.secondaryScale);

        ctx.strokeStyle = axisStyle.color;
        ctx.globalAlpha = 0.4;
        ctx.lineWidth = 1;
        for(let y = Math.floor(view.minYear/sStep)*sStep; y <= view.maxYear; y+=sStep) {
            if(y < view.minYear || y > view.maxYear) continue;
            let x = MARGIN_X + (y - view.minYear) * pxPerYear;
            ctx.beginPath(); ctx.moveTo(x, height*0.4); ctx.lineTo(x, height*0.6); ctx.stroke();
        }
        ctx.globalAlpha = 1.0;

        ctx.lineWidth = Math.max(2, axisStyle.width-1);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = '600 12px "Source Sans 3", sans-serif';
        for(let y = Math.floor(view.minYear/pStep)*pStep; y <= view.maxYear; y+=pStep) {
            if(y < view.minYear || y > view.maxYear) continue;
            let x = MARGIN_X + (y - view.minYear) * pxPerYear;
            ctx.beginPath(); ctx.moveTo(x, height*0.25); ctx.lineTo(x, height*0.75); ctx.stroke();
            
            let textY = height*0.85;
            ctx.strokeStyle = '#fdfcfa'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
            ctx.strokeText(y, x, textY);
            ctx.fillStyle = axisStyle.color;
            ctx.fillText(y, x, textY);
        }

        const connections = document.querySelectorAll('.connection-line');
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]); 
        connections.forEach(conn => {
            const left = parseFloat(conn.style.left);
            const isTop = conn.style.bottom === '50%';
            const h = parseFloat(conn.style.height);
            ctx.strokeStyle = conn.style.borderLeftColor;
            
            ctx.beginPath();
            if(isTop) {
                ctx.moveTo(left, height/2);
                ctx.lineTo(left, height/2 - h);
            } else {
                ctx.moveTo(left, height/2);
                ctx.lineTo(left, height/2 + h);
            }
            ctx.stroke();
        });
        ctx.setLineDash([]); 

        const cards = document.querySelectorAll('.event-card');
        const points = document.querySelectorAll('.event-point');

        points.forEach(pt => {
            const left = parseFloat(pt.style.left);
            ctx.fillStyle = pt.style.backgroundColor;
            ctx.beginPath(); ctx.arc(left, height/2, 6, 0, 2*Math.PI); ctx.fill();
        });

        cards.forEach((card, index) => {
            const ev = events[index]; 
            const left = parseFloat(card.style.left);
            
            const rect = card.getBoundingClientRect();
            const parentRect = elTimeline.getBoundingClientRect();
            const exactX = rect.left - parentRect.left;
            const exactY = rect.top - parentRect.top;
            const w = rect.width;
            const h = rect.height;

            ctx.fillStyle = '#fff';
            ctx.fillRect(exactX, exactY, w, h);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            ctx.strokeRect(exactX, exactY, w, h);
            
            ctx.fillStyle = ev.color;
            ctx.fillRect(exactX, exactY, w, 3);

            let currentY = exactY + 8;
            
            if(ev.image && imgMap[ev.id]) {
                const imgW = ev.imgW || 52;
                const imgH = ev.imgH || 40;
                ctx.drawImage(imgMap[ev.id], exactX + 8, currentY, imgW, imgH);
                ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
                ctx.strokeRect(exactX + 8, currentY, imgW, imgH);
                currentY += imgH + 6;
            }

            ctx.fillStyle = '#4a5568';
            ctx.font = '600 10px "Source Sans 3", sans-serif'; 
            ctx.textAlign = 'left';
            let dateStr = formatDate(ev.start);
            if(ev.type === 'period' && ev.end.y) dateStr += " - " + formatDate(ev.end);
            ctx.fillText(dateStr, exactX + 8, currentY);
            currentY += 14;

            ctx.fillStyle = '#1a202c';
            ctx.font = '600 12px "Lora", serif'; 
            wrapTextCanvas(ctx, ev.title, exactX + 8, currentY, w - 16, 14, 2);
            currentY += 16 * Math.min(2, Math.ceil(ctx.measureText(ev.title).width / (w-16)));

            if(ev.desc) {
                ctx.fillStyle = '#4a5568';
                ctx.font = '10px "Source Sans 3", sans-serif';
                wrapTextCanvas(ctx, ev.desc, exactX + 8, currentY, w - 16, 12, 2);
            }
        });

        return canvas;
    }

    async function exportToPNG() {
        const canvas = await generateExportCanvas();
        if(!canvas) return;
        
        const link = document.createElement('a');
        link.download = 'frise-chronologique.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    async function exportToPDF() {
        const canvas = await generateExportCanvas();
        if(!canvas) return;
        
        const dataUrl = canvas.toDataURL('image/png');
        
        const printContainer = document.createElement('div');
        printContainer.id = 'print-container';
        printContainer.style.position = 'absolute';
        printContainer.style.top = '0';
        printContainer.style.left = '0';
        printContainer.style.width = '100vw';
        printContainer.style.minHeight = '100vh';
        printContainer.style.backgroundColor = '#fff';
        printContainer.style.zIndex = '99999';
        printContainer.innerHTML = `<img src="${dataUrl}" style="max-width: 100%; height: auto; display: block; margin: 0 auto;">`;
        
        const style = document.createElement('style');
        style.textContent = `
            @media print {
                body > *:not(#print-container) { display: none !important; }
                body { margin: 0; padding: 0; background: #fff; }
                @page { size: landscape; margin: 1cm; }
            }
        `;
        
        document.body.appendChild(style);
        document.body.appendChild(printContainer);
        
        setTimeout(() => {
            window.print();
            document.body.removeChild(printContainer);
            document.body.removeChild(style);
        }, 300);
    }

    function wrapTextCanvas(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
        const words = text.split(' ');
        let line = '';
        let lines = 0;

        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            let testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                ctx.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
                lines++;
                if(lines >= maxLines) break;
            } else {
                line = testLine;
            }
        }
        if(lines < maxLines) {
            if (ctx.measureText(line).width > maxWidth) {
                ctx.fillText(line.substring(0, line.length-3) + '...', x, y);
            } else {
                ctx.fillText(line, x, y);
            }
        }
    }

    function escapeHTML(str) {
        if(!str) return '';
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.onload = init;
</script>
